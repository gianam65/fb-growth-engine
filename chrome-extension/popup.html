<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cozy Vibe</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { width: 360px; margin: 0; padding: 14px; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { margin: 8px 0; }
  label { display: block; font-size: 11px; color: #888; margin-bottom: 3px; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; }
  textarea { resize: vertical; min-height: 50px; }
  button { padding: 9px 14px; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  .save { width: 100%; background: #3ae07f; color: #000; padding: 11px; }
  .save:disabled { opacity: 0.5; cursor: wait; }
  .gear { background: transparent; color: #888; padding: 4px 8px; font-size: 11px; }
  .preview { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: #eee; vertical-align: middle; margin-right: 8px; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .msg { padding: 8px 10px; border-radius: 6px; margin-top: 8px; font-size: 12px; word-break: break-all; }
  .ok { background: #e6f9ed; color: #1a7f3a; }
  .err { background: #fdeaea; color: #b32d2d; }
  .hint { color: #888; font-size: 11px; margin-top: 4px; line-height: 1.4; }
  .hr { height: 1px; background: #eee; margin: 12px 0; border: 0; }
  @media (prefers-color-scheme: dark) {
    body { background:#1a1a1a; color:#e0e0e0; }
    input, textarea { background:#2a2a2a; color:#fff; border-color:#3a3a3a; }
    .ok { background:#143421; color:#7be88a; }
    .err { background:#3a1f1f; color:#ff8a8a; }
    .preview { background:#333; }
    .gear { color:#aaa; }
  }
</style>
</head>
<body>

<div id="settings" hidden>
  <h1>Setup</h1>
  <div class="row">
    <label>Worker URL</label>
    <input id="workerUrl" placeholder="https://fb-growth-engine.namgia-dev.workers.dev">
  </div>
  <div class="row">
    <label>Admin token</label>
    <input id="adminToken" type="password" placeholder="ADMIN_TOKEN">
  </div>
  <div class="row">
    <button id="saveSettings" class="save">Save settings</button>
  </div>
  <div class="hint">After saving, click the extension icon again to add products.</div>
</div>

<div id="add" hidden>
  <div class="head">
    <h1>Save product</h1>
    <button id="openSettings" class="gear" title="Settings">⚙</button>
  </div>
  <div class="row" id="previewWrap" hidden>
    <img id="previewImg" class="preview" alt="">
  </div>
  <div class="row">
    <label>Affiliate link <small style="color:#b32d2d">*</small></label>
    <input id="affiliateUrl" placeholder="https://s.shopee.vn/XYZ">
    <div class="hint">Click "Get link" / "Copy link" on Shopee first, then paste here.</div>
  </div>
  <div class="row">
    <label>Title</label>
    <input id="title" placeholder="auto-detected">
  </div>
  <div class="row">
    <label>Image URL</label>
    <input id="imageUrl" placeholder="auto-detected">
  </div>
  <div class="row">
    <label>Price <small style="color:#888">(optional)</small></label>
    <input id="price" placeholder="">
  </div>
  <div class="row">
    <button id="save" class="save">💾 Save to Cozy Vibe pool</button>
  </div>
  <div id="msg" class="msg" hidden></div>
  <div class="hr"></div>
  <div class="row" style="display:flex; gap:8px;">
    <button id="viewAffiliate" class="gear" style="flex:1; background:#444; color:#fff; padding:8px; border-radius:6px;">📋 Affiliate pool</button>
    <button id="viewPhotos" class="gear" style="flex:1; background:#444; color:#fff; padding:8px; border-radius:6px;">🖼 Photo pool</button>
  </div>
  <div class="hint">
    Tip: copy the affiliate URL on Shopee → open this popup → it auto-pastes from clipboard if allowed.
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
