name: Generate FB post

on:
  schedule:
    # 00:00 UTC = 07:00 Asia/Ho_Chi_Minh
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview mode: generate N images only (no upload), upload as artifact'
        required: false
        default: '0'
        type: string
      style_preset:
        description: 'Style preset (asian-cozy / japandi / kinfolk / rainy-cafe / dark-academia)'
        required: false
        default: 'asian-cozy'
        type: string

concurrency:
  group: generate-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Generate post
        run: |
          PREVIEW='${{ inputs.preview || '0' }}'
          if [ "$PREVIEW" != "0" ] && [ -n "$PREVIEW" ]; then
            npm run script:generate-post -- --preview=$PREVIEW
          else
            npm run script:generate-post
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          FB_GRAPH_VERSION: 'v21.0'
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash-lite'
          STYLE_PRESET: ${{ inputs.style_preset || 'asian-cozy' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Collect preview images
        if: ${{ inputs.preview != '' && inputs.preview != '0' }}
        run: |
          mkdir -p preview-out
          src=$(ls -td /tmp/post-* 2>/dev/null | head -1)
          if [ -n "$src" ]; then
            cp -v "$src"/*.png preview-out/ 2>/dev/null || true
          fi
          ls -la preview-out/
      - name: Upload preview artifact
        if: ${{ inputs.preview != '' && inputs.preview != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: post-preview-${{ inputs.style_preset || 'asian-cozy' }}
          path: preview-out/
          retention-days: 7
