name: Sync Worker Secrets

# Pulls values from GitHub Repository Secrets and pushes them to the Cloudflare
# Worker as runtime secrets. Run this once after adding/changing any secret in
# GitHub. GitHub auto-masks the values in logs.
#
# Trigger: Actions tab → Sync Worker Secrets → Run workflow

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Push secrets to Worker
        env:
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_VERIFY_TOKEN: ${{ secrets.FB_VERIFY_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -e
          for name in FB_APP_SECRET FB_VERIFY_TOKEN FB_PAGE_ACCESS_TOKEN FB_PAGE_ID GEMINI_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID ADMIN_TOKEN; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::warning::$name is empty in GitHub Secrets — skipping"
              continue
            fi
            echo "Pushing $name to Worker"
            printf '%s' "$value" | npx wrangler secret put "$name"
          done

      - name: List Worker secrets (verification)
        run: npx wrangler secret list
