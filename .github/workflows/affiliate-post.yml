name: Affiliate post (2/day)

on:
  schedule:
    # 04:00 UTC = 11:00 ICT (sáng) — peak browsing
    - cron: '0 4 * * *'
    # 07:00 UTC = 14:00 ICT (test slot) — quiet afternoon
    - cron: '0 7 * * *'
    # 12:00 UTC = 19:00 ICT (tối) — peak browsing
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: affiliate-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run script:affiliate-post
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          FB_GRAPH_VERSION: 'v21.0'
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash-lite'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Telegram alert on failure
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="❌ *${{ github.workflow }}* failed%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
