name = "fb-growth-engine"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "fb-growth"
database_id = "ea2ab248-c877-4f2b-91ac-932e2a52f781"
migrations_dir = "migrations"

# Queue producer (webhook → push events)
[[queues.producers]]
binding = "EVENTS"
queue = "fb-growth-events"

# Queue consumer (process events asynchronously)
[[queues.consumers]]
queue = "fb-growth-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "fb-growth-events-dlq"

# Vars (non-secret)
[vars]
FB_GRAPH_VERSION = "v21.0"
GEMINI_MODEL = "gemini-2.5-flash-lite"
LOG_LEVEL = "info"

# Cloudflare Workers cron — primary scheduler (CF cron is far more reliable
# than GH Actions cron). Worker dispatches the GH workflow via API at the
# scheduled time. Hourly tick is the watchdog (catches any rare miss).
#
#   00:00 UTC = 07:00 ICT  → Pinterest curate-post
#   04:00 UTC = 11:00 ICT  → Affiliate post (AM)
#   07:00 UTC = 14:00 ICT  → Affiliate post (test slot — remove later)
#   12:00 UTC = 19:00 ICT  → Affiliate post (PM)
#   xx:05      → hourly watchdog (overdue check + retry)
[triggers]
crons = [
  "0 0 * * *",
  "0 4 * * *",
  "0 7 * * *",
  "0 12 * * *",
  "5 * * * *"
]

# Secrets are set via: wrangler secret put <NAME>
# Required secrets:
#   FB_APP_SECRET            — for webhook signature verification
#   FB_VERIFY_TOKEN          — random string you choose, must match FB webhook config
#   FB_PAGE_ACCESS_TOKEN     — long-lived page token
#   FB_PAGE_ID               — your page ID
#   GEMINI_API_KEY           — Google AI Studio key
#   TELEGRAM_BOT_TOKEN       — for daily reports
#   TELEGRAM_CHAT_ID         — your chat ID for receiving alerts
